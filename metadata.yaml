name: marvelous_snail # 插件唯一识别名，以 astrbot_plugin_ 前缀开头
display_name: 最强蜗牛🐌 # 用于展示的名字，可以是方便人类阅读的名字（需要版本 >= v4.5.0，低版本不会报错，请放心填写）
desc: 
  1.爬虫，抓取攻略，通知（贝塔，飞碟，北方，蜗牛官方）
  2.定时消息的设定，每日通知，在一个时间段内提醒成员。（需要有物种周循环）
  3.配置相关最强蜗牛知识库，对于简单的攻略能通过ai模型回答
 # 插件简短描述
version: v1.0.0 # 插件版本号。格式：v1.1.1 或者 v1.1
author: Himzandar # 作者
repo: https://github.com/Himzandar/astrbot_plugin_marvelous_snail # 插件的仓库地址
